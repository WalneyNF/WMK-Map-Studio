<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>WMK Map Studio</title></head><body><header><img src="./assets/branding/logo-principal.webp" alt="WMK Map Studio" width="120" height="68"><strong>WMK MAP STUDIO</strong><small>v0.2.1 · Editor 2D</small><span id="status" role="status"></span></header><nav id="toolbar"><button data-act="new">Novo projeto</button><button data-act="open">Abrir JSON</button><button data-act="save">Salvar JSON</button><button data-act="undo">Desfazer</button><button data-act="redo">Refazer</button><button data-act="map">Novo mapa</button><button data-act="recover">Recuperar autosave</button><button data-act="reset">Restaurar layout</button><details><summary>Painéis</summary><div id="panel-menu"></div></details></nav><main id="workspace"><section class="panel" data-panel="project"><h2>Projeto <button class="close" aria-label="Fechar">×</button></h2><div class="content"><label>Nome <input id="project-name" maxlength="120"></label><h3>Mapas</h3><div id="maps"></div><h3>Camadas 2D</h3><div class="mini-tools"><button id="add-layer">+</button><button id="delete-layer">−</button><button id="layer-up">↑</button><button id="layer-down">↓</button></div><div id="layers"></div><label>Opacidade da camada<input id="opacity" type="range" min="0" max="1" step="0.05" value="1"></label><h3>Paleta de tiles</h3><div id="tile-palette"></div><h3>Importar spritesheet</h3><label>Tile (px)<input id="sheet-size" type="number" value="32"></label><label>Margem<input id="sheet-margin" type="number" value="0"></label><label>Espaçamento<input id="sheet-spacing" type="number" value="0"></label><input id="sheet" type="file" accept="image/png,image/webp"></div></section><section class="panel" data-panel="viewport"><h2>Viewport <button class="close" aria-label="Fechar">×</button></h2><div class="content viewport"><div id="tile-tools"><button data-tool="paint">Pincel</button><button data-tool="erase">Borracha</button><button data-tool="pan">Mover</button></div><canvas id="canvas"></canvas><p id="view-label"></p></div></section><section class="panel" data-panel="properties"><h2>Propriedades <button class="close" aria-label="Fechar">×</button></h2><div class="content" id="properties"></div></section><section class="panel" data-panel="console"><h2>Console <button class="close" aria-label="Fechar">×</button></h2><div class="content" id="log" role="log"></div></section></main><footer>Walney Moreira Klein — <a href="mailto:walneyk@hotmail.com">walneyk@hotmail.com</a> · Etapa 1 · Licença MIT</footer><input type="file" id="file" accept=".json,application/json" hidden><dialog id="map-dialog"><form id="map-form"><h2>Novo mapa</h2><label>Nome<input name="name" required maxlength="120" value="Novo mapa"></label><label>Tipo<select name="type"><option value="2d">2D</option><option value="3d">3D (estrutura)</option></select></label><label>Largura<input type="number" name="width" min="1" max="4096" value="32" required></label><label>Altura<input type="number" name="height" min="1" max="4096" value="24" required></label><label>Tile (px)<input type="number" name="tileSize" min="1" max="512" value="32" required></label><button type="submit">Criar</button><button type="button" id="cancel-map">Cancelar</button></form></dialog><script type="module" src="/src/app/main.js"></script></body></html>
